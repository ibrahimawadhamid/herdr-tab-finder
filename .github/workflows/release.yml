name: release

# Pushing a tag like v1.2.0 publishes a GitHub release whose notes are that version's section of
# CHANGELOG.md, after checking that the tag, main.js and both installers agree on the version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "export const VERSION = \"$v\"" "mods/Tab finder/main.js" || { echo "main.js VERSION isn't $v"; exit 1; }
          grep -q "^VERSION=$v\$" install.sh || { echo "install.sh VERSION isn't $v"; exit 1; }
          grep -q "\$TfVersion = \"$v\"" install.ps1 || { echo "install.ps1 version isn't $v"; exit 1; }
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as it is."
          else
            gh release create "$GITHUB_REF_NAME" --title "Tab finder $v" --notes-file notes.md --verify-tag
          fi
