name: Idea
description: Suggest something Tab finder could do better.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What gets in your way
      description: The situation and what's hard about it today. This matters more than the solution.
      placeholder: With 30 agents running, I can't tell at a glance which ones…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you imagine it working. Sketches and examples welcome.
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: It keeps Tab finder quiet (only what needs you gets loud).
        - label: It works for people with a setup different from mine.
