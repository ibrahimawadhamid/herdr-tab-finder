name: Bug report
description: Something in Tab finder doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please don't include private tab names, notes or paths you'd rather keep to yourself; made-up ones are fine.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
      placeholder: I pressed ctrl-shift-g, typed "api" and pressed Enter, but…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a space with…
        2. …
  - type: input
    id: herdr
    attributes:
      label: Herdr version
      description: Run `herdr-app --version`.
      placeholder: herdr-app 0.1.18
    validations:
      required: true
  - type: input
    id: tabfinder
    attributes:
      label: Tab finder version
      description: Run `sh install.sh --version`, or see VERSION at the top of main.js.
      placeholder: 1.0.0
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where you used it
      multiple: true
      options: [As a popup, As a tab, In a layout or floating block]
  - type: textarea
    id: shots
    attributes:
      label: Screenshot or error
      description: A screenshot, or the error from `herdr-app status` or `herdr-app check`, helps a lot.
